# Publish a release on GitHub (tag vX.Y.Z, new or existing): the KidsOS zip is built, boot-tested in BusyBox
# and attached to that release a few minutes later. A draft builds nothing until it is published.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full zip unzip
      - name: Build the zip (cross-compiles in the Docker toolchain, downloads the pinned Onion release)
        run: make dist KIDSOS_VERSION="${GITHUB_REF_NAME#v}"
      - name: Boot the zip's onion.pak in BusyBox
        run: make test-dist KIDSOS_VERSION="${GITHUB_REF_NAME#v}"
      - name: Install the zip on a fake fresh card without pressing anything
        run: make test-first-install KIDSOS_VERSION="${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          files: build/KidsOS-*.zip
